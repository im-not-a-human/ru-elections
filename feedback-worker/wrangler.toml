name = "gbv-feedback"
main = "worker.js"
compatibility_date = "2024-09-01"

# Несекретные переменные. Меняйте свободно — попадают в репо.
[vars]
GITHUB_REPO = "im-not-a-human/ru-elections"
ALLOWED_ORIGINS = "https://im-not-a-human.github.io,http://localhost:8765,http://127.0.0.1:8765"

# Секреты НЕ хранятся в этом файле. Установите их через CLI:
#
#   wrangler secret put GITHUB_TOKEN          # обязательно
#   wrangler secret put TURNSTILE_SECRET      # опционально (рекомендуется)
#
# Подробнее — см. README.md в этой папке.
